name: Lean CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Build pinned Lean project
        uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
          use-mathlib-cache: true
      - name: Audit public theorem axioms
        run: lake env lean Hilbert16/AxiomAudit.lean
